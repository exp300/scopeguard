# Fly.io app config for ScopeGuard
# Generated for migration from Railway
# Docs: https://fly.io/docs/reference/configuration/

app = "scopeguard"
primary_region = "fra"  # Frankfurt — EU, low latency for both EU and US East

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"        # stop when idle to save credit
  auto_start_machines = true          # auto-wake on incoming request
  min_machines_running = 1            # keep 1 always running — no cold starts
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

[deploy]
  release_command = ""  # add DB migrations here if needed in the future
